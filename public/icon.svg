<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#166534" />
      <stop offset="100%" stop-color="#14532d" />
    </linearGradient>
    <linearGradient id="leaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="100%" stop-color="#22c55e" />
    </linearGradient>
    <linearGradient id="badge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>
  <!-- Background with rounded squircle for maskable/app icon -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  
  <!-- Soil / Furrows -->
  <path d="M 64 380 Q 256 340 448 380 L 448 420 Q 256 380 64 420 Z" fill="#22c55e" opacity="0.3" />
  <path d="M 90 410 Q 256 370 422 410 L 422 445 Q 256 405 90 445 Z" fill="#22c55e" opacity="0.2" />

  <!-- Agricultural Plant / Sprout -->
  <g transform="translate(140, 110)">
    <!-- Main stem -->
    <path d="M 116 250 C 116 160 110 90 120 40 C 122 80 134 180 124 250 Z" fill="#86efac" />
    <!-- Left Leaf -->
    <path d="M 116 170 C 40 170 10 110 30 70 C 70 60 110 100 116 170 Z" fill="url(#leaf)" />
    <!-- Right Leaf -->
    <path d="M 120 130 C 190 120 226 70 206 34 C 160 30 126 75 120 130 Z" fill="url(#leaf)" />
  </g>

  <!-- Attendance Check Badge -->
  <g transform="translate(280, 280)">
    <circle cx="90" cy="90" r="80" fill="#ffffff" />
    <circle cx="90" cy="90" r="70" fill="#16a34a" />
    <!-- Checkmark -->
    <path d="M 55 90 L 80 115 L 128 65" fill="none" stroke="#ffffff" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
